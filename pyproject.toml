[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "passive-resume-extractor"
version = "0.1.0"
description = "Schema-driven passive resume extraction from natural conversation with delta merge"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "YuShou-C" }]
keywords = ["resume", "extraction", "schema", "llm", "delta", "chinese", "nlp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["passive_resume_extractor*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
